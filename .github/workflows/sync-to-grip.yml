name: Sync to Grip

# On every push to main that touches the add-on, copy it into oleroma/Grip/extensions/combi_export.
on:
  push:
    branches: [main]
    paths:
      - "combi_export/**"
  workflow_dispatch:

concurrency:
  group: sync-to-grip
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Pushes close together (a merge, then a quick fix) land in Grip as one sync commit:
      # a newer push cancels this run while it waits, and that run copies the latest add-on.
      - name: Wait for more pushes
        run: sleep 300

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: oleroma/Grip
          ref: main
          path: grip
          token: ${{ secrets.GRIP_DISPATCH_TOKEN }}
          lfs: false

      - name: Copy add-on into Grip
        run: |
          rm -rf grip/extensions/combi_export
          mkdir -p grip/extensions/combi_export
          cp -r combi_export/. grip/extensions/combi_export/
          find grip/extensions/combi_export -name "__pycache__" -type d -prune -exec rm -rf {} +

      - name: Commit and push if changed
        working-directory: grip
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A extensions/combi_export
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Sync combi_export from ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
