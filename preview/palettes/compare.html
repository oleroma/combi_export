<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Palette comparison</title>
<style>
  html, body { margin: 0; background: #2a2b2e; font-family: "Segoe UI", sans-serif; overflow: hidden; }
  .grid { display: grid; grid-template-columns: 940px 940px; gap: 20px 20px; padding: 20px; width: 1880px; }
  figure { margin: 0; }
  img { display: block; width: 940px; height: 529px; border-radius: 8px; }
  figcaption { color: #e6e6e9; font-size: 22px; font-weight: 600; padding: 8px 4px 0; }
  figcaption span { color: #9a9aa2; font-weight: 400; }
</style>
</head>
<body>
<div class="grid">
  <figure><img src="thumbnail_paper.png"><figcaption>A · Paper <span>light, blue + green</span></figcaption></figure>
  <figure><img src="thumbnail_blue.png"><figcaption>B · Blender blue <span>dark navy, one hue</span></figcaption></figure>
  <figure><img src="thumbnail_mono.png"><figcaption>C · Monochrome <span>neutral greys, no hue</span></figcaption></figure>
  <figure><img src="thumbnail_gold.png"><figcaption>D · Slate + gold <span>steel grey, yellow accent</span></figcaption></figure>
</div>
</body>
</html>
